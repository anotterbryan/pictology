# Pages CMS configuration: the editor Carole uses to add artwork, write studio notes and update her info.
# Sign in at https://app.pagescms.org with GitHub and pick this repo.
# Docs: https://pagescms.org/docs/configuration/

media:
  input: src/images
  output: /images
  categories:
  - image
content:
- name: artworks
  label: Artwork (gallery)
  type: collection
  path: src/artworks
  filename: '{primary}.md'
  format: yaml-frontmatter
  view:
    primary: title
    fields:
    - title
    - featured
    - published
    sort: order
    order: asc
  fields:
  - name: title
    label: Title
    type: string
    required: true
  - name: image
    label: Photo
    type: image
    required: true
    options:
      path: src/images/art
  - name: image2
    label: Second photo (optional, e.g. the other side)
    type: image
    options:
      path: src/images/art
  - name: image_alt
    label: Photo description (for screen readers)
    type: string
    description: e.g. "Red pysanka ornament with white spirals"
  - name: shop
  label: Shop & inventory
  type: file
  path: src/_data/shop.json
  format: json
  fields:
  - name: title
    label: Shop page title
    type: string
  - name: intro
    label: Shop intro
    type: text
  - name: payment_note
    label: Payment note
    type: text
  - name: card_themes
    label: Card themes customers can pick
    type: string
    list: true
  - name: egg_themes
    label: Egg styles customers can pick
    type: string
    list: true
  - name: products
    label: Products & inventory
    type: object
    list: true
    fields:
    - name: id
      label: Code (unique, no spaces, e.g. card-4)
      type: string
    - name: section
      label: Shop section
      type: select
      options:
        values:
        - name: cards
          label: Collaged cards
        - name: eggs
          label: Pysanky eggs
        - name: bulk
          label: Bulk & shop packs
        - name: onhand
          label: On hand now (one of a kind)
    - name: name
      label: Name
      type: string
    - name: image
      label: Photo
      type: image
      options:
        path: src/images/art
    - name: price
      label: Price in dollars (leave blank for "Price on request")
      type: string
    - name: pack_size
      label: Pieces per pack (1 for singles)
      type: number
    - name: themes
      label: Let customers pick themes?
      type: select
      options:
        values:
        - name: card
          label: Yes, card themes
        - name: egg
          label: Yes, egg styles
        - name: ""
          label: No (a specific piece)
    - name: stock
      label: On hand (how many ready now; leave blank for "Made to order")
      type: string
    - name: note
      label: Small label (e.g. "Most popular")
      type: string
    - name: desc
      label: Description
      type: text
  - name: promise
    label: What to expect (the four promise cards)
    type: object
    list: true
    fields:
    - name: icon
      label: Emoji
      type: string
    - name: title
      label: Heading
      type: string
    - name: text
      label: Text
      type: text
- name: site
  label: Site settings
  type: file
  path: src/_data/site.json
  format: json
  fields:
  - name: name
    label: Site name
    type: string
  - name: artist
    label: Artist name
    type: string
  - name: url
    label: Web address
    type: string
  - name: location
    label: Location
    type: string
  - name: hero_eyebrow
    label: Top banner — small line above the headline
    type: string
  - name: hero_title
    label: Top banner — headline
    type: string
    description: Put *asterisks* around one word to make it gold italic.
  - name: hero_text
    label: Top banner — intro text
    type: text
  - name: falling_eggs
    label: Falling eggs (little eggs drift down the screen like snowflakes)
    type: boolean
    default: true
  - name: promo_eyebrow
    label: Special callout — small line (e.g. "New this season")
    type: string
  - name: promo_title
    label: Special callout — headline (leave blank to hide the callout)
    type: string
  - name: promo_text
    label: Special callout — text
    type: text
  - name: promo_image
    label: Special callout — photo
    type: image
    options:
      path: src/images/art
  - name: about_title
    label: About — heading
    type: string
  - name: about_teaser
    label: Meet Carole — short intro on the home page (2–3 sentences)
    type: text
  - name: about_body
    label: About page — your full story
    type: text
    description: Leave a blank line between paragraphs.
  - name: about_image
    label: About — main photo
    type: image
    options:
      path: src/images/site
  - name: portrait
    label: About — portrait (small round photo)
    type: image
    options:
      path: src/images/site
  - name: contact_title
    label: Contact — heading
    type: string
  - name: contact_blurb
    label: Contact — text
    type: text
  - name: email
    label: Email (optional)
    type: string
  - name: facebook
    label: Facebook link
    type: string
  - name: instagram
    label: Instagram link (optional)
    type: string
  - name: etsy
    label: Etsy or shop link (optional)
    type: string
  - name: seo_title
    label: Google — page title for the home page
    type: string
    description: Shown as the blue headline in Google results. Keep it under about 65 characters.
  - name: meta_description
    label: Google — description (1–2 sentences)
    type: text
  - name: full_name
    label: Full name (for Google)
    type: string
  - name: share_image
    label: Photo shown when the site is shared on Facebook or in a text
    type: image
    options:
      path: src/images/art
  - name: google_verification
    label: Google Search Console verification code (Bryan sets this)
    type: string
