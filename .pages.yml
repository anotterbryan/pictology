# Pages CMS configuration: the editor Carole uses to add artwork, write studio notes and update her info.
# Sign in at https://app.pagescms.org with GitHub and pick this repo.
# Docs: https://pagescms.org/docs/configuration/

media:
  input: src/images
  output: /images
  categories:
  - image
content:
- name: artworks
  label: Artwork (gallery)
  type: collection
  path: src/artworks
  filename: '{primary}.md'
  format: yaml-frontmatter
  view:
    primary: title
    fields:
    - title
    - featured
    - published
    sort: order
    order: asc
  fields:
  - name: title
    label: Title
    type: string
    required: true
  - name: image
    label: Photo
    type: image
    required: true
    options:
      path: src/images/art
  - name: image_alt
    label: Photo description (for screen readers)
    type: string
    description: e.g. "Red pysanka ornament with white spirals"
  - name: site
  label: Site settings
  type: file
  path: src/_data/site.json
  format: json
  fields:
  - name: name
    label: Site name
    type: string
  - name: artist
    label: Artist name
    type: string
  - name: url
    label: Web address
    type: string
  - name: location
    label: Location
    type: string
  - name: hero_eyebrow
    label: Top banner — small line above the headline
    type: string
  - name: hero_title
    label: Top banner — headline
    type: string
    description: Put *asterisks* around one word to make it gold italic.
  - name: hero_text
    label: Top banner — intro text
    type: text
  - name: promo_eyebrow
    label: Special callout — small line (e.g. "New this season")
    type: string
  - name: promo_title
    label: Special callout — headline (leave blank to hide the callout)
    type: string
  - name: promo_text
    label: Special callout — text
    type: text
  - name: promo_image
    label: Special callout — photo
    type: image
    options:
      path: src/images/art
  - name: about_title
    label: About — heading
    type: string
  - name: about_teaser
    label: Meet Carole — short intro on the home page (2–3 sentences)
    type: text
  - name: about_body
    label: About page — your full story
    type: text
    description: Leave a blank line between paragraphs.
  - name: about_image
    label: About — main photo
    type: image
    options:
      path: src/images/site
  - name: portrait
    label: About — portrait (small round photo)
    type: image
    options:
      path: src/images/site
  - name: contact_title
    label: Contact — heading
    type: string
  - name: contact_blurb
    label: Contact — text
    type: text
  - name: email
    label: Email (optional)
    type: string
  - name: facebook
    label: Facebook link
    type: string
  - name: instagram
    label: Instagram link (optional)
    type: string
  - name: etsy
    label: Etsy or shop link (optional)
    type: string
  - name: meta_description
    label: Google description (1–2 sentences)
    type: text
